---
name: Test Arch Linux

on:
  pull_request:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - master
      - main

env:
  TWITCH_PUBSUB_SERVER_TAG: v1.0.12
  HTTPBOX_TAG: v0.2.1
  QT_QPA_PLATFORM: minimal

concurrency:
  group: test-arch-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test Arch Linux"
    # Skip on forks — release downloads and Arch CI are flaky / expensive here.
    if: github.repository == 'Chatterino/chatterino2'
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          sudo pacman -Syu --noconfirm
          sudo pacman -S --noconfirm qt6-base qt6-tools boost-libs qt6-imageformats qtkeychain-qt6 qt6-svg libnotify git boost cmake benchmark

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build directory
        run: mkdir build-test

      - name: Install httpbox
        run: |
          curl -L -o httpbox.tar.xz "https://github.com/Chatterino/httpbox/releases/download/${{ env.HTTPBOX_TAG }}/httpbox-x86_64-unknown-linux-gnu.tar.xz"
          tar -xJf httpbox.tar.xz
          mv ./httpbox-x86_64-unknown-linux-gnu/httpbox /usr/local/bin
        working-directory: /tmp

      - name: Download and extract Twitch PubSub Server Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir pubsub-server-test
          url="https://github.com/Chatterino/twitch-pubsub-server-test/releases/download/${TWITCH_PUBSUB_SERVER_TAG}/server-${TWITCH_PUBSUB_SERVER_TAG}-linux-amd64.tar.gz"
          for i in 1 2 3 4 5; do
            curl --fail --retry 3 --retry-all-errors -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o pubsub-server.tar.gz "$url" && break
            sleep $((i * 2))
          done
          # Detect GitHub JSON error pages (e.g. rate limit / not found) before tar
          if ! gzip -t pubsub-server.tar.gz 2>/dev/null; then
            echo "Downloaded file is not a gzip archive:"
            head -c 500 pubsub-server.tar.gz || true
            exit 1
          fi
          tar -xzf pubsub-server.tar.gz -C pubsub-server-test

      - name: Configure
        run: |
          cmake \
            -DBUILD_TESTS=On \
            -DBUILD_BENCHMARKS=On \
            -DBUILD_APP=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            ..
        working-directory: build-test

      - name: Build
        run: |
          cmake --build . -j $(nproc)
        working-directory: build-test

      - name: Test
        timeout-minutes: 30
        run: |
          httpbox --port 9051 &
          cd ../pubsub-server-test
          ./server 127.0.0.1:9050 127.0.0.1:9052 &
          cd ../build-test
          ctest --repeat until-pass:4 --output-on-failure
        working-directory: build-test
