---
name: Sync upstream

on:
  schedule:
    # Twice daily (UTC)
    - cron: "0 5,17 * * *"
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream repository (owner/name)
        required: true
        default: Chatterino/chatterino2
      upstream_branch:
        description: Upstream branch to rebase onto
        required: true
        default: master

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Rebase master onto upstream
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Needed so the rebase push uses a token with contents:write
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase onto upstream and push
        id: rebase
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'Chatterino/chatterino2' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          BEFORE="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "Local HEAD:     ${BEFORE}"
          echo "Upstream HEAD:  ${UPSTREAM_SHA}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date (upstream is an ancestor of this branch)."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          is_protected() {
            case "$1" in
              README.md|.github/workflows|.github/workflows/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          rebase_in_progress() {
            [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]
          }

          resolve_protected_conflicts() {
            local conflicted other="" f
            conflicted="$(git diff --name-only --diff-filter=U || true)"
            [ -n "${conflicted}" ] || return 1

            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              if is_protected "${f}"; then
                # During rebase, --theirs is the commit being replayed (this fork).
                if git checkout --theirs -- "${f}" 2>/dev/null; then
                  git add -- "${f}"
                else
                  git rm -f -- "${f}" || true
                fi
              else
                echo "Unresolved conflict: ${f}"
                other=1
              fi
            done <<< "${conflicted}"

            [ -z "${other}" ]
          }

          restore_protected() {
            git rm -rf --ignore-unmatch .github/workflows
            git checkout "${BEFORE}" -- README.md .github/workflows
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep local GitHub Actions and README after upstream rebase"
            fi
          }

          if ! git rebase "upstream/${UPSTREAM_BRANCH}"; then
            while rebase_in_progress; do
              if ! resolve_protected_conflicts; then
                git rebase --abort || true
                echo "changed=false" >> "${GITHUB_OUTPUT}"
                echo "conflict=true" >> "${GITHUB_OUTPUT}"
                echo "::error::Rebase onto upstream/${UPSTREAM_BRANCH} failed due to conflicts."
                exit 1
              fi
              if ! GIT_EDITOR=: git rebase --continue; then
                if rebase_in_progress; then
                  continue
                fi
                git rebase --abort || true
                echo "changed=false" >> "${GITHUB_OUTPUT}"
                echo "conflict=true" >> "${GITHUB_OUTPUT}"
                echo "::error::Rebase onto upstream/${UPSTREAM_BRANCH} failed due to conflicts."
                exit 1
              fi
            done
          fi

          restore_protected

          AFTER="$(git rev-parse HEAD)"
          echo "Rebased HEAD:   ${AFTER}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "before=${BEFORE}" >> "${GITHUB_OUTPUT}"
          echo "after=${AFTER}" >> "${GITHUB_OUTPUT}"

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create or update conflict issue
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'Chatterino/chatterino2' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          set -euo pipefail

          TITLE="Upstream sync rebase conflict"
          BODY="$(cat <<EOF
          Automatic rebase of \`master\` onto \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` failed due to conflicts.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Resolve locally:
          \`\`\`bash
          git fetch https://github.com/${UPSTREAM_REPO}.git ${UPSTREAM_BRANCH}
          git rebase FETCH_HEAD
          # fix conflicts (keep this fork's README.md and .github/workflows/), then:
          git push --force-with-lease origin master
          \`\`\`
          EOF
          )"

          EXISTING="$(gh issue list --state open --search "in:title ${TITLE}" --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "Sync failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}"
          fi
